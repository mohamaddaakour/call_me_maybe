[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Schema-constrained function calling with a small language model"
requires-python = ">=3.10"
dependencies = [
    "llm-sdk",
    "numpy>=1.26",
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "flake8>=7.0",
    "mypy>=1.10",
]

# The supplied SDK joins the workspace so the torch pin below reaches it.
# Sources declared on the workspace root apply to every member's dependencies,
# which is what lets us redirect the SDK's torch requirement.
[tool.uv.workspace]
members = ["llm_sdk"]

[tool.uv.sources]
llm-sdk = { workspace = true }
# The project runs entirely on CPU, so torch comes from the CPU-only wheel
# index. The default PyPI wheel drags in the CUDA runtime (nvidia-*, triton),
# which is several gigabytes of code this project never executes.
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
# Only requirements that name this index explicitly are resolved against it
explicit = true

[tool.mypy]
exclude = ["llm_sdk/"]

# The SDK is supplied code with no type information, so treat it as untyped
# instead of type-checking it
[[tool.mypy.overrides]]
module = ["llm_sdk", "llm_sdk.*"]
follow_imports = "skip"
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
