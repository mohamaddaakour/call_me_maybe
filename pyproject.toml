[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Schema-constrained function calling with a small language model"
requires-python = ">=3.10"
dependencies = [
    "llm-sdk",
    "numpy>=1.26",
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "flake8>=7.0",
    "mypy>=1.10",
]

[tool.uv.sources]
llm-sdk = { path = "llm_sdk" }

[tool.mypy]
exclude = ["llm_sdk/"]

# The SDK is supplied code with no type information, so treat it as untyped
# instead of type-checking it
[[tool.mypy.overrides]]
module = ["llm_sdk", "llm_sdk.*"]
follow_imports = "skip"
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
